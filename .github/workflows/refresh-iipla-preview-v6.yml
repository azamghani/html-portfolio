name: Refocus IIPLA on patent rights
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-iipla-preview-v6.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iipla-preview-copy-update
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply only the reviewed v6 copy to the isolated preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, tempfile, urllib.request
          repo = os.environ['REPOSITORY']
          assert repo == 'azamghani/html-portfolio'
          folder = 'iipla-patent-brokerage/'
          expected_base = '3ac1a0d781e2bb991e64b21ed1918b686e2d2e42a17490da78b2af4d2452fa6c'
          expected_v6 = 'b62f5b731d807618dfc72d120904f5c84d27660be561c855425baaba1730052e'
          api = 'https://api.github.com/repos/' + repo + '/contents/' + folder + 'index.html'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'}
          def request(url, method='GET', data=None, authenticated=False):
              req = urllib.request.Request(url, method=method, headers=headers if authenticated else {'User-Agent': 'IIPLA-preview-build'}, data=None if data is None else json.dumps(data).encode())
              with urllib.request.urlopen(req, timeout=40) as response:
                  return response.read()
          current = json.loads(request(api + '?ref=main', authenticated=True))
          source = base64.b64decode(current['content'])
          actual = hashlib.sha256(source).hexdigest()
          if actual == expected_v6:
              print('Reviewed v6 is already published.'); raise SystemExit(0)
          assert actual == expected_base, 'Source changed; reconcile before publishing: ' + actual
          with tempfile.TemporaryDirectory() as tmp:
              root = pathlib.Path(tmp)
              for name in ['build_v6.py', 'copy-v6.json', 'faqs-v6.json']:
                  url = 'https://raw.githubusercontent.com/' + repo + '/' + os.environ['SOURCE_COMMIT'] + '/' + folder + name
                  (root / name).write_bytes(request(url))
              (root / 'base.html').write_bytes(source)
              subprocess.run(['python3', str(root / 'build_v6.py'), str(root / 'base.html'), str(root / 'index.html')], check=True)
              output = (root / 'index.html').read_bytes()
          checksum = hashlib.sha256(output).hexdigest()
          assert checksum == expected_v6, 'Output differs from the locally tested page: ' + checksum
          payload = {'message': 'Refocus IIPLA on direct patent sales, IP licensing and patent monetization partnerships', 'content': base64.b64encode(output).decode(), 'sha': current['sha'], 'branch': 'main'}
          result = json.loads(request(api, 'PUT', payload, authenticated=True))
          print('Published reviewed v6:', result['commit']['sha'], checksum)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Patent-rights scope update prepared\n\nVerified against the locally tested output. Only the isolated preview HTML was replaced. Three scoped offerings, 30 FAQs, owner and buyer notice revisions. Existing forms, categories, validation and buyer modal are retained. No live intake enabled.\n')
          PY
