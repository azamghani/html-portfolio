name: Verify IIPLA public preview
on:
  push:
    branches: [main]
    paths:
      - 'iipla-patent-brokerage/index.html'
      - 'iipla-patent-brokerage/README.md'
      - '.github/workflows/verify-iipla-public-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-iipla-public-preview
  cancel-in-progress: true
jobs:
  public-url-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify patent-rights-only copy, notices, FAQs and preserved forms
        run: |
          python3 - <<'PY'
          import hashlib, os, time, urllib.request, urllib.error
          from html.parser import HTMLParser
          url = 'https://azamghani.github.io/html-portfolio/iipla-patent-brokerage/'
          expected = 'b62f5b731d807618dfc72d120904f5c84d27660be561c855425baaba1730052e'
          class PageCheck(HTMLParser):
              def __init__(self):
                  super().__init__(); self.required=set(); self.cards=0; self.routes=0; self.steps=0; self.faqs=0; self.notice_sections=0; self.forms=set(); self.buyer_links=0; self.closing=0; self.dialogs=set()
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if 'required' in a: self.required.add(a.get('id'))
                  classes=a.get('class','').split()
                  if 'tech-card' in classes: self.cards+=1
                  if 'option-card' in classes: self.routes+=1
                  if 'process-item' in classes: self.steps+=1
                  if 'notice-section' in classes: self.notice_sections+=1
                  if 'closing' in classes: self.closing+=1
                  if 'data-faq-item' in a: self.faqs+=1
                  if 'data-buyer-open' in a: self.buyer_links+=1
                  if tag=='form': self.forms.add(a.get('id'))
                  if tag=='dialog': self.dialogs.add(a.get('id'))
          last_error = None
          for attempt in range(36):
              try:
                  req=urllib.request.Request(url+'?check='+str(int(time.time())),headers={'User-Agent':'IIPLA-preview-verification','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req, timeout=12) as response:
                      assert response.status==200
                      body=response.read()
                  assert hashlib.sha256(body).hexdigest()==expected, 'Waiting for reviewed v6 deployment'
                  text=body.decode('utf-8'); parser=PageCheck(); parser.feed(text)
                  assert {'phone','buyer-phone','buyer-company','encumbrances','representation','notice-accepted','buyer-notice-accepted','buyer-contact-consent'} <= parser.required
                  assert parser.cards==32 and parser.routes==3 and parser.steps==5
                  assert parser.faqs==30 and parser.notice_sections==10
                  assert parser.closing==1 and parser.buyer_links==2
                  assert {'lead-form','portfolio-form','buyer-form'} <= parser.forms
                  assert {'submission-notice','buyer-enquiry'} <= parser.dialogs
                  assert "mode: 'preview'" in text and "mode:'preview'" in text and 'noindex,nofollow' in text
                  assert 'Patent<br>Monetization' in text and '6.0-patent-rights' in text
                  assert 'patent-monetization-2026-09-22-v2' in text and 'BP-2026-09-22-2' in text
                  assert 'License your technology' not in text and 'license your technology' not in text
                  for phrase in ['Direct patent sale.','Direct IP licensing.','Monetization partnership.','patent-scope-title']:
                      assert phrase in text
                  print('PUBLIC_URL_VERIFIED:',url)
                  print('HTTP 200; exact v6 SHA256; patent-rights-only service; 30 FAQs; 32 categories; one closing CTA; two buyer links; mandatory phones; preview only.')
                  with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
                      summary.write('## Public patent-rights scope update verified\n\n'+url+'\n\nUnauthenticated HTTP 200 and exact locally tested v6 source verified. Direct patent sale, direct IP licensing and patent monetization partnerships. No technology-commercialization offer. All three forms, required phone numbers, category selection, buyer links and modal retained. 30 FAQs and versioned notices. No live lead capture enabled.\n')
                  break
              except (urllib.error.URLError,AssertionError,TimeoutError) as exc:
                  last_error=exc;print('Waiting:',str(exc));time.sleep(10)
          else:
              raise RuntimeError('Public verification failed: '+str(last_error))
          PY
