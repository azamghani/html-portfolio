name: Verify IIPLA public preview
on:
  push:
    branches: [main]
    paths:
      - 'iipla-patent-brokerage/index.html'
      - 'iipla-patent-brokerage/README.md'
      - '.github/workflows/verify-iipla-public-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-iipla-public-preview
  cancel-in-progress: true
jobs:
  public-url-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check the v3 public URL without authentication
        run: |
          python3 - <<'PY'
          import hashlib, os, time, urllib.request, urllib.error
          from html.parser import HTMLParser
          url = 'https://azamghani.github.io/html-portfolio/iipla-patent-brokerage/'
          expected = '96eb5133a3a238e1f3b42e6377936ddfad375be5403acfa396212d3feab58464'
          class PageCheck(HTMLParser):
              def __init__(self):
                  super().__init__(); self.required=set(); self.cards=0; self.routes=0; self.steps=0; self.forms=set()
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if 'required' in a: self.required.add(a.get('id'))
                  classes=a.get('class','').split()
                  if 'tech-card' in classes: self.cards+=1
                  if 'option-card' in classes: self.routes+=1
                  if 'process-item' in classes: self.steps+=1
                  if tag=='form': self.forms.add(a.get('id'))
          last_error = None
          for attempt in range(24):
              try:
                  req=urllib.request.Request(url+'?check='+str(int(time.time())), headers={'User-Agent':'IIPLA-preview-verification','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req, timeout=12) as response:
                      assert response.status==200
                      body=response.read()
                  assert hashlib.sha256(body).hexdigest()==expected, 'Waiting for latest v3 HTML deployment'
                  text=body.decode('utf-8')
                  parser=PageCheck(); parser.feed(text)
                  assert {'phone','encumbrances','representation'} <= parser.required
                  assert parser.cards==32 and parser.routes==3 and parser.steps==5
                  assert {'lead-form','portfolio-form'} <= parser.forms
                  assert "mode: 'preview'" in text and 'noindex,nofollow' in text
                  assert '3.0-2026-09-22' in text
                  print('PUBLIC_URL_VERIFIED:', url)
                  print('HTTP 200; exact v3 SHA-256 match; 32 technologies; 3 routes; 5 process steps; mandatory phone; preview forms.')
                  with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
                      summary.write('## Public v3 URL verified\n\n'+url+'\n\nUnauthenticated HTTP 200. Exact HTML source integrity checked. Three monetization routes, five process steps, 32 technology categories and required phone confirmed. Forms remain in preview mode.\n')
                  break
              except (urllib.error.URLError, AssertionError, TimeoutError) as exc:
                  last_error=exc
                  print('Waiting for Pages deployment:', str(exc))
                  time.sleep(10)
          else:
              raise RuntimeError('Public preview verification failed: '+str(last_error))
          PY
