name: Verify IIPLA public preview
on:
  push:
    branches: [main]
    paths:
      - 'iipla-patent-brokerage/index.html'
      - 'iipla-patent-brokerage/README.md'
      - '.github/workflows/verify-iipla-public-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-iipla-public-preview
  cancel-in-progress: true
jobs:
  public-url-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify public Monetization branding, FAQs and submission notice
        run: |
          python3 - <<'PY'
          import hashlib, os, time, urllib.request, urllib.error
          from html.parser import HTMLParser
          url = 'https://azamghani.github.io/html-portfolio/iipla-patent-brokerage/'
          expected = '28a3909cdfd1aa9d11b62d00c828aed6b5b1f52ec7b8105101e8dda2a3836c98'
          class PageCheck(HTMLParser):
              def __init__(self):
                  super().__init__(); self.required=set(); self.cards=0; self.routes=0; self.steps=0; self.faqs=0; self.notice_sections=0; self.forms=set()
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if 'required' in a: self.required.add(a.get('id'))
                  classes=a.get('class','').split()
                  if 'tech-card' in classes: self.cards+=1
                  if 'option-card' in classes: self.routes+=1
                  if 'process-item' in classes: self.steps+=1
                  if 'notice-section' in classes: self.notice_sections+=1
                  if 'data-faq-item' in a: self.faqs+=1
                  if tag=='form': self.forms.add(a.get('id'))
          last_error = None
          for attempt in range(24):
              try:
                  req=urllib.request.Request(url+'?check='+str(int(time.time())), headers={'User-Agent':'IIPLA-preview-verification','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req, timeout=12) as response:
                      assert response.status==200
                      body=response.read()
                  assert hashlib.sha256(body).hexdigest()==expected, 'Waiting for latest Monetization HTML deployment'
                  text=body.decode('utf-8')
                  parser=PageCheck(); parser.feed(text)
                  assert {'phone','encumbrances','representation','notice-accepted'} <= parser.required
                  assert parser.cards==32 and parser.routes==3 and parser.steps==5
                  assert parser.faqs==28 and parser.notice_sections==10
                  assert {'lead-form','portfolio-form'} <= parser.forms
                  assert "mode: 'preview'" in text and 'privacyApproved: false' in text and 'noindex,nofollow' in text
                  assert '4.1-2026-09-22' in text and 'Patent<br>Monetization' in text
                  assert 'patent-monetization-2026-09-22-v1' in text
                  print('PUBLIC_URL_VERIFIED:', url)
                  print('HTTP 200; exact SHA-256 match; Patent Monetization header; 28 FAQs; 10 notice sections; required phone and notice consent; preview forms.')
                  with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
                      summary.write('## Public Monetization URL verified\n\n'+url+'\n\nUnauthenticated HTTP 200. Exact HTML source integrity verified. Updated header, 28 detailed FAQs, 10-section submission notice, versioned acknowledgement, three monetization routes and all 32 categories. Phone remains mandatory. Live intake remains disabled.\n')
                  break
              except (urllib.error.URLError, AssertionError, TimeoutError) as exc:
                  last_error=exc
                  print('Waiting for Pages deployment:', str(exc))
                  time.sleep(10)
          else:
              raise RuntimeError('Public preview verification failed: '+str(last_error))
          PY
