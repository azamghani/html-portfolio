name: Refresh IIPLA preview v3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-iipla-preview-v3.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iipla-preview-copy-update
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build and verify the reviewed v3 HTML
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, tempfile, urllib.request
          repo = os.environ['REPOSITORY']
          assert repo == 'azamghani/html-portfolio'
          folder = 'iipla-patent-brokerage/'
          path = folder + 'index.html'
          expected_base = '99a1196e0d5a9576840082f2ef346a314851d845f41536a5fba3a6779fb8eeda'
          expected_v3 = '96eb5133a3a238e1f3b42e6377936ddfad375be5403acfa396212d3feab58464'
          api_url = 'https://api.github.com/repos/' + repo + '/contents/' + path
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'}
          def request(url, method='GET', data=None, authenticated=False):
              req = urllib.request.Request(url, method=method, headers=headers if authenticated else {'User-Agent':'IIPLA-preview-build'}, data=None if data is None else json.dumps(data).encode())
              with urllib.request.urlopen(req, timeout=40) as response:
                  return response.read()
          current = json.loads(request(api_url + '?ref=main', authenticated=True))
          raw = base64.b64decode(current['content'])
          actual = hashlib.sha256(raw).hexdigest()
          if actual == expected_v3:
              print('Reviewed v3 HTML is already published.')
              raise SystemExit(0)
          assert actual == expected_base, 'The page changed after review; reconcile before publishing: ' + actual
          with tempfile.TemporaryDirectory() as tmp:
              root = pathlib.Path(tmp)
              for name in ['build_v3.py', 'v3-refinements.css']:
                  url = 'https://raw.githubusercontent.com/' + repo + '/' + os.environ['SOURCE_COMMIT'] + '/' + folder + name
                  (root / name).write_bytes(request(url))
              (root / 'base.html').write_bytes(raw)
              subprocess.run(['python3', str(root / 'build_v3.py'), str(root / 'base.html'), str(root / 'index.html')], check=True)
              result = (root / 'index.html').read_bytes()
          assert hashlib.sha256(result).hexdigest() == expected_v3, 'Output differs from the locally tested page'
          text = result.decode('utf-8')
          assert "mode: 'preview'" in text and 'noindex,nofollow' in text
          assert '3.0-2026-09-22' in text
          payload = {'message': 'Publish IIPLA v3: sales, licensing, partnerships and seller disclosures', 'content': base64.b64encode(result).decode(), 'sha': current['sha'], 'branch': 'main'}
          response = json.loads(request(api_url, 'PUT', payload, authenticated=True))
          print('Published', path, 'at', response['commit']['sha'])
          print('Only the isolated preview HTML was replaced. Main IIPLA website and lead endpoints unchanged.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## IIPLA v3 HTML prepared\n\nVerified against the locally tested output. The existing public preview path is unchanged. Forms remain in preview mode.\n')
          PY
